<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCtl — Network Controller</title>
    <style>
        :root {
            --bg: #0f1117;
            --bg2: #1a1d2e;
            --bg3: #252840;
            --fg: #e2e8f0;
            --fg2: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --border: #2a2d3e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            background: var(--bg);
            color: var(--fg);
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .header h1 span { color: var(--cyan); }
        .header .stats {
            display: flex;
            gap: 24px;
            font-size: 13px;
        }
        .header .stats div {
            background: var(--bg2);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .stat-value { font-size: 18px; font-weight: 700; }
        .stat-label { font-size: 11px; color: var(--fg2); text-transform: uppercase; }
        .stat-green { color: var(--green); }
        .stat-red { color: var(--red); }
        .stat-blue { color: var(--blue); }
        .stat-yellow { color: var(--yellow); }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background: var(--bg2);
            color: var(--fg);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover {
            background: var(--bg3);
            border-color: var(--blue);
        }
        button.primary {
            background: var(--blue);
            border-color: var(--blue);
            color: white;
        }
        button.primary:hover { background: #2563eb; }
        button.danger { border-color: var(--red); color: var(--red); }
        button.danger:hover { background: var(--red); color: white; }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 12px;
        }
        .device-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
        }
        .device-card:hover {
            border-color: var(--blue);
            transform: translateY(-1px);
        }
        .device-card.blocked {
            border-color: var(--red);
            opacity: 0.7;
        }
        .device-card.throttled {
            border-color: var(--yellow);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        .device-name {
            font-size: 15px;
            font-weight: 600;
        }
        .device-ip {
            font-size: 12px;
            color: var(--fg2);
        }
        .device-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }
        .status-online { background: rgba(34,197,94,0.15); color: var(--green); }
        .status-offline { background: rgba(148,163,184,0.15); color: var(--fg2); }
        .status-blocked { background: rgba(239,68,68,0.15); color: var(--red); }

        .device-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .device-details .label { color: var(--fg2); }
        .device-details .value { color: var(--fg); text-align: right; }

        .device-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .device-controls button {
            padding: 6px 12px;
            font-size: 12px;
        }
        .speed-input {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 6px 10px;
            border-radius: 6px;
            width: 80px;
            font-family: inherit;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--fg2);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--fg2);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h2 { margin-bottom: 8px; }
        .empty-state p { font-size: 14px; margin-bottom: 20px; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 12px; }
            .header .stats { flex-wrap: wrap; }
            .device-grid { grid-template-columns: 1fr; }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            min-width: 300px;
        }
        .modal h3 { margin-bottom: 12px; }
        .modal .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .modal .info-row:last-child { border: none; }
        .modal-close { margin-top: 16px; width: 100%; }

        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg3);
            margin: 1px;
        }
        .vuln-critical { background: rgba(239,68,68,0.2); color: var(--red); }
        .vuln-high { background: rgba(234,179,8,0.2); color: var(--yellow); }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>🌐</span> NetCtl</h1>
        <div class="stats">
            <div><div class="stat-value stat-green" id="count-online">0</div><div class="stat-label">Online</div></div>
            <div><div class="stat-value" id="count-total">0</div><div class="stat-label">Total</div></div>
            <div><div class="stat-value stat-red" id="count-blocked">0</div><div class="stat-label">Blocked</div></div>
            <div><div class="stat-value stat-yellow" id="count-throttled">0</div><div class="stat-label">Throttled</div></div>
        </div>
    </div>

    <div class="controls">
        <button class="primary" onclick="scanNetwork()">🔍 Scan Network</button>
        <button onclick="fetchDevices()">🔄 Refresh</button>
        <button class="danger" onclick="resetAll()">⛔ Reset All</button>
        <span id="scan-status" style="color:var(--fg2);font-size:13px;align-self:center;"></span>
    </div>

    <div id="device-list" class="device-grid">
        <div class="empty-state">
            <div class="icon">📡</div>
            <h2>No Devices Found</h2>
            <p>Scan your network to discover connected devices</p>
            <button class="primary" onclick="scanNetwork()">🔍 Scan Now</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="modal-overlay" id="modal">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
        const API = '';
        let autoRefresh = null;

        async function api(path, opts = {}) {
            const res = await fetch(API + path, {
                headers: { 'Content-Type': 'application/json' },
                ...opts
            });
            return res.json();
        }

        function toast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = '⚠️ ' + msg;
            el.style.display = 'block';
            el.style.borderColor = type === 'error' ? 'var(--red)' : type === 'success' ? 'var(--green)' : 'var(--border)';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function showModal(html) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-content').innerHTML = html;
            modal.classList.add('active');
        }
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        document.getElementById('modal').onclick = (e) => {
            if (e.target === e.currentTarget) closeModal();
        };

        async function fetchDevices() {
            const data = await api('/api/devices');
            const container = document.getElementById('device-list');

            if (!data.devices || data.devices.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📡</div>
                        <h2>No Devices Found</h2>
                        <p>Scan your network to discover connected devices</p>
                        <button class="primary" onclick="scanNetwork()">🔍 Scan Now</button>
                    </div>`;
                updateStats({ total: 0, online: 0, blocked: 0, throttled: 0 });
                return;
            }

            // Sort: online first, then by IP
            const sorted = data.devices.sort((a, b) => {
                if (a.online !== b.online) return a.online ? -1 : 1;
                return a.ip.localeCompare(b.ip, undefined, { numeric: true });
            });

            let html = '';
            let stats = { online: 0, total: sorted.length, blocked: 0, throttled: 0 };

            for (const dev of sorted) {
                if (dev.online) stats.online++;
                if (dev.blocked) stats.blocked++;
                if (dev.speed_limit > 0) stats.throttled++;

                const isBlocked = dev.blocked;
                const isThrottled = dev.speed_limit > 0;
                const cardClass = isBlocked ? 'device-card blocked' : isThrottled ? 'device-card throttled' : 'device-card';
                const statusClass = isBlocked ? 'status-blocked' : dev.online ? 'status-online' : 'status-offline';
                const statusText = isBlocked ? '🔴 Blocked' : dev.online ? '🟢 Online' : '⚪ Offline';
                const hostname = dev.nickname || dev.hostname || 'Unknown';
                const vendor = dev.vendor || '-';
                const type = dev.device_type || 'unknown';
                const speedText = dev.speed_limit > 0 ? `${dev.speed_limit} Kbps` : 'Full';
                const lastSeen = dev.last_seen ? new Date(dev.last_seen + 'Z').toLocaleString() : '-';

                html += `
                <div class="${cardClass}" onclick="showDeviceModal('${dev.mac}')">
                    <div class="device-header">
                        <div>
                            <div class="device-name">${escHtml(hostname)}</div>
                            <div class="device-ip">${dev.ip}</div>
                        </div>
                        <span class="device-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="device-details">
                        <span class="label">MAC</span><span class="value">${dev.mac}</span>
                        <span class="label">Vendor</span><span class="value">${escHtml(vendor)}</span>
                        <span class="label">Type</span><span class="value">${type}</span>
                        <span class="label">Speed</span><span class="value">${speedText}</span>
                    </div>
                    <div class="device-controls" onclick="event.stopPropagation()">
                        ${isBlocked ?
                            `<button onclick="unblockDevice('${dev.mac}','${dev.ip}')">🔓 Unblock</button>` :
                            `<button class="danger" onclick="blockDevice('${dev.mac}','${dev.ip}')">🔴 Block</button>`
                        }
                        <input class="speed-input" type="number" placeholder="Kbps" value="${dev.speed_limit || ''}"
                               onchange="throttleDevice('${dev.mac}','${dev.ip}', this.value)">
                        <button onclick="showDeviceModal('${dev.mac}')">📋 Details</button>
                    </div>
                </div>`;
            }

            container.innerHTML = html;
            updateStats(stats);
        }

        function updateStats(stats) {
            document.getElementById('count-online').textContent = stats.online || 0;
            document.getElementById('count-total').textContent = stats.total || 0;
            document.getElementById('count-blocked').textContent = stats.blocked || 0;
            document.getElementById('count-throttled').textContent = stats.throttled || 0;
        }

        async function showDeviceModal(mac) {
            const data = await api('/api/devices/' + mac);
            const dev = data;
            const html = `
                <h3>📋 Device Details</h3>
                <div class="info-row"><span>IP</span><span>${dev.ip}</span></div>
                <div class="info-row"><span>MAC</span><span>${dev.mac}</span></div>
                <div class="info-row"><span>Hostname</span><span>${escHtml(dev.hostname||'-')}</span></div>
                <div class="info-row"><span>Vendor</span><span>${escHtml(dev.vendor||'-')}</span></div>
                <div class="info-row"><span>Type</span><span>${dev.device_type||'unknown'}</span></div>
                <div class="info-row"><span>Status</span><span>${dev.online ? '🟢 Online' : '⚪ Offline'}</span></div>
                <div class="info-row"><span>First Seen</span><span>${dev.first_seen||'-'}</span></div>
                <div class="info-row"><span>Last Seen</span><span>${dev.last_seen||'-'}</span></div>
                ${dev.speed_limit > 0 ? `<div class="info-row"><span>Speed Limit</span><span>${dev.speed_limit} Kbps</span></div>` : ''}
                ${dev.blocked ? '<div class="info-row"><span style="color:var(--red)">🔴 Blocked</span><span>Yes</span></div>' : ''}
                <button class="modal-close" onclick="closeModal()">Close</button>
            `;
            showModal(html);
        }

        async function scanNetwork() {
            const status = document.getElementById('scan-status');
            status.innerHTML = '<span class="loading"></span> Scanning...';
            try {
                const data = await api('/api/scan', { method: 'POST' });
                status.textContent = `✅ ${data.total} devices found in ${data.duration}`;
                toast(`Scan complete: ${data.total} devices, ${data.online} online`, 'success');
                fetchDevices();
            } catch(e) {
                status.textContent = '❌ Scan failed';
                toast('Scan failed: ' + e.message, 'error');
            }
        }

        async function blockDevice(mac, ip) {
            await api('/api/block', { method: 'POST', body: JSON.stringify({ mac, ip }) });
            toast(`Blocked: ${mac}`, 'success');
            fetchDevices();
        }

        async function unblockDevice(mac, ip) {
            await api('/api/unblock', { method: 'POST', body: JSON.stringify({ mac, ip }) });
            toast(`Unblocked: ${mac}`, 'success');
            fetchDevices();
        }

        async function throttleDevice(mac, ip, speed) {
            const s = parseInt(speed) || 0;
            await api('/api/throttle', { method: 'POST', body: JSON.stringify({ mac, ip, speed: s }) });
            toast(s > 0 ? `Throttled: ${s} Kbps` : `Unlimited`, 'success');
            fetchDevices();
        }

        async function resetAll() {
            if (!confirm('Reset all rules?')) return;
            await api('/api/reset', { method: 'POST' });
            toast('All rules reset', 'success');
            fetchDevices();
        }

        function escHtml(s) {
            if (!s) return '-';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        // Auto-refresh every 10 seconds
        fetchDevices();
        autoRefresh = setInterval(fetchDevices, 10000);
    </script>
</body>
</html>
